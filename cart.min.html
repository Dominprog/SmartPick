<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SmartPick — Корзина</title>
<link rel="stylesheet" href="css/normalize.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
    <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="6" y="2" width="12" height="20" rx="3" stroke="#2F6FED" stroke-width="2"/><circle cx="12" cy="18" r="1" fill="#2F6FED"/></svg>
        SmartPick
    </div>
    <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#98a1b3" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" placeholder="Поиск смартфонов...">
    </div>
    <div class="header-actions">
        <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="#3d4356" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z"/></svg><span>Избранное</span></a>
        <a href="cart.html"><svg viewBox="0 0 24 24" fill="none" stroke="#3d4356" stroke-width="2"><path d="M3 6h18M6 6l1.5 13h9L18 6M9 10v5M15 10v5"/></svg><span>Корзина</span></a>
        <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="#3d4356" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span>Профиль</span></a>
        <button class="burger"><span></span><span></span><span></span></button>
    </div>
</header>

<div class="crumbs"><a href="index.html">Главная</a> / <b>Корзина</b></div>

<div class="cart-layout">

    <section class="cart-list">

        <div class="cart-item">
            <div class="thumb-box"><img src="assets/images (1).png" alt="Apple iPhone 15"></div>
            <div class="info">
                <h3>Apple iPhone 15</h3>
                <span class="price">2 699 Br</span>
                <div class="qty-row">
                    <button class="qty-btn">−</button>
                    <span>1</span>
                    <button class="qty-btn">+</button>
                </div>
            </div>
        </div>

        <div class="cart-item">
            <div class="thumb-box"><img src="assets/images (2).png" alt="Samsung Galaxy S24"></div>
            <div class="info">
                <h3>Samsung Galaxy S24</h3>
                <span class="price">2 199 Br</span>
                <div class="qty-row">
                    <button class="qty-btn">−</button>
                    <span>1</span>
                    <button class="qty-btn">+</button>
                </div>
            </div>
        </div>

        <div class="cart-item">
            <div class="thumb-box"><img src="assets/images (3).png" alt="Xiaomi 14"></div>
            <div class="info">
                <h3>Xiaomi 14</h3>
                <span class="price">1 999 Br</span>
                <div class="qty-row">
                    <button class="qty-btn">−</button>
                    <span>2</span>
                    <button class="qty-btn">+</button>
                </div>
            </div>
        </div>

    </section>

    <aside class="cart-summary">
        <div class="summary-row"><span>Товары (4)</span><span>8 896 Br</span></div>
        <div class="summary-row"><span>Доставка</span><span>Бесплатно</span></div>
        <div class="summary-row total"><span>Итого</span><span>8 896 Br</span></div>
        <button class="buy-btn">Оформить заказ</button>
    </aside>

</div>

<footer class="site-footer">
    © 2026 SmartPick — учебный проект, лабораторная работа №5 «Вёрстка мобильно-ориентированного приложения»
</footer>

<script src="js/script.js"></script>
</body>
</html>
